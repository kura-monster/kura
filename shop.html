<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kura — Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Times New Roman", Times, Georgia, serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid #000;
            padding: 22px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .site-title {
            font-size: 1.7rem;
            font-style: italic;
            letter-spacing: 4px;
        }
        nav { display: flex; gap: 24px; flex-wrap: wrap; }
        nav a {
            color: #000;
            text-decoration: none;
            font-size: 0.88rem;
            padding: 4px 0;
            border-bottom: 1px solid transparent;
            transition: all 0.25s ease;
        }
        nav a:hover {
            border-bottom: 1px solid #000;
            font-style: italic;
        }
        nav a:visited { color: #000; }
        main {
            flex: 1;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 40px;
        }
        h1 {
            font-size: 2.4rem;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        h2 {
            font-size: 1.25rem;
            font-weight: normal;
            font-style: italic;
            margin: 32px 0 12px;
            letter-spacing: 1px;
        }
        h3 {
            font-size: 0.95rem;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: lowercase;
            margin-bottom: 18px;
            color: #333;
            font-style: italic;
        }
        hr { border: none; border-top: 1px solid #000; margin: 24px 0; }
        hr.double { border: none; border-top: 3px double #000; }
        p { font-size: 1rem; margin-bottom: 16px; }
        .small { font-size: 0.85rem; color: #333; font-style: italic; }
        .lead {
            font-size: 1.15rem;
            font-style: italic;
        }
        .ornament {
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 12px;
            margin: 10px 0;
            color: #000;
        }
        .section {
            margin-bottom: 56px;
            scroll-margin-top: 100px;
        }
        footer {
            border-top: 1px solid #000;
            padding: 24px 40px;
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            font-style: italic;
            background: #fff;
        }
        .stat-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
            font-style: italic;
        }
        .balance-box {
            border: 1px solid #000;
            padding: 20px 28px;
            margin: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .balance-value {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.8rem;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .shop-item {
            border: 1px solid #000;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .shop-item .price {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1rem;
        }
        .seller-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
        .seller-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .buy-btn {
            border: 1px solid #000;
            background: #fff;
            color: #000;
            padding: 8px 0;
            font-style: italic;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: auto;
        }
        .buy-btn:hover { background: #000; color: #fff; }
        .buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .logout-link {
            display: inline-block;
            margin-top: 32px;
            font-size: 0.8rem;
            font-style: italic;
            color: #000;
            text-decoration: underline;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #c00;
        }
        @media (max-width: 560px) { .shop-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header id="site-header">
        <div class="site-title">— Kura —</div>
        <nav>
            <a href="index.html">home</a>
            <a href="auth.html">login</a>
        </nav>
    </header>

    <main>
        <section class="section" data-section>
            <div class="ornament">❦ ❦ ❦</div>
            <h1>Shop.</h1>
            <div class="subtitle">— spend your money —</div>
            <hr class="double">

            <div class="balance-box">
                <span class="stat-label">Your Balance</span>
                <span class="balance-value" id="balance">— loading —</span>
            </div>

            <div class="loading" id="shop-loading">Loading shop items...</div>
            <div class="error" id="shop-error" style="display: none;"></div>
            <div class="shop-grid" id="shop-grid" style="display: none;"></div>

            <span class="logout-link" id="logout">→ logout</span>
        </section>
    </main>

    <footer>
        <p>© MMXXV Kura — enter at your own risk</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (function () {
            'use strict';

            const balanceEl = document.getElementById('balance');
            const shopGridEl = document.getElementById('shop-grid');
            const shopLoadingEl = document.getElementById('shop-loading');
            const shopErrorEl = document.getElementById('shop-error');

            async function load() {
                const session = await checkSession();
                if (!session) {
                    redirectToLogin();
                    return;
                }
                balanceEl.textContent = session.balance.toLocaleString('en-US') + ' money';
                await loadProducts();
                bindButtons();
            }

            async function loadProducts() {
                shopLoadingEl.style.display = 'block';
                shopErrorEl.style.display = 'none';
                shopGridEl.style.display = 'none';
                
                try {
                    const res = await fetch(WORKER_URL + '/api/products', {
                        credentials: 'include'
                    });
                    if (!res.ok) throw new Error('Failed to load products');
                    
                    const products = await res.json();
                    renderProducts(products);
                } catch (err) {
                    console.error('Error loading products:', err);
                    shopErrorEl.textContent = 'Failed to load shop items. Please try again later.';
                    shopErrorEl.style.display = 'block';
                } finally {
                    shopLoadingEl.style.display = 'none';
                }
            }

            function renderProducts(products) {
                if (!products || products.length === 0) {
                    shopErrorEl.textContent = 'No products available.';
                    shopErrorEl.style.display = 'block';
                    return;
                }
                
                shopGridEl.innerHTML = '';
                products.forEach(product => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'shop-item';
                    itemEl.innerHTML = `
                        <h3>${product.name}</h3>
                        <p class="small">${product.description}</p>
                        <span class="price">${product.price.toLocaleString('en-US')} money</span>
                        <div class="seller-info">
                            <img class="seller-icon" src="${product.seller_icon || 'https://discord.com/assets/2c21a0d6de53828cbdbc9087bd04e6622b56de9665d3d31241dcac2cb9e563b7.png'}" alt="Seller">
                            <span>${product.seller_name || 'Unknown Seller'} (${product.seller_id})</span>
                        </div>
                        <button class="buy-btn" data-product-id="${product.id}">Buy</button>
                    `;
                    shopGridEl.appendChild(itemEl);
                });
                
                shopGridEl.style.display = 'grid';
            }

            function bindButtons() {
                document.getElementById('logout').addEventListener('click', logout);
                
                // Use event delegation for dynamically created buttons
                shopGridEl.addEventListener('click', function (e) {
                    if (e.target.classList.contains('buy-btn')) {
                        const productId = e.target.dataset.productId;
                        purchaseProduct(productId, e.target);
                    }
                });
            }

            async function purchaseProduct(productId, btn) {
                btn.disabled = true;
                btn.textContent = '...';
                try {
                    const res = await fetch(WORKER_URL + '/api/purchase', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product_id: productId })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        alert(data.error || 'Purchase failed.');
                        btn.disabled = false;
                        btn.textContent = 'Buy';
                        return;
                    }
                    balanceEl.textContent = data.money.toLocaleString('en-US') + ' money';
                    alert('Purchased successfully! Remaining: ' + data.money);
                    
                    // Reset button state
                    btn.disabled = false;
                    btn.textContent = 'Buy';
                    
                    // Update other buttons' disabled state based on new balance
                    document.querySelectorAll('.buy-btn').forEach(button => {
                        // We'd need to fetch product price to check affordability
                        // For simplicity, we'll just re-enable all buttons - the purchase API will validate balance
                    });
                } catch (err) {
                    console.warn('purchase error:', err);
                    btn.disabled = false;
                    btn.textContent = 'Buy';
                }
            }

            load();
        })();
    </script>
</body>
</html>
