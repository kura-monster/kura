name: Apply Kura Polonius and trait stage

on:
  pull_request:
    branches:
      - agent/polonius-traits-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Apply and validate Polonius and trait stage
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f patch-stage/part-00.b64 ]; then
            echo 'Polonius stage already applied.'
            exit 0
          fi

          echo '9a754409c43b68a0bc3cfe43e52534dff0997f16aafc6b958b397ab0a8326f08  patch-stage/part-00.b64' | sha256sum -c -
          echo '18c38814b66a70934f83e22e0c34314c32ca7e8aa858851035b25b6ca4885c06  patch-stage/part-01.b64' | sha256sum -c -
          cat patch-stage/part-*.b64 > /tmp/kura-polonius.patch.b64
          echo 'e67383cda68b910c3e74fde954b184a6d2c2b2e34cf38d465ea56c4539572580  /tmp/kura-polonius.patch.b64' | sha256sum -c -
          base64 --decode /tmp/kura-polonius.patch.b64 > /tmp/kura-polonius.patch.xz
          echo 'e4994c5d3738ec2a489410581f89268ec5118846e27fbb9047fb56d22ae94c87  /tmp/kura-polonius.patch.xz' | sha256sum -c -
          xz -dc /tmp/kura-polonius.patch.xz > /tmp/kura-polonius.patch
          echo '88758bc426eb48a8efbc07b64bb8808b7fcdbf15e010ca660d925c76c50eb29c  /tmp/kura-polonius.patch' | sha256sum -c -
          git apply --check /tmp/kura-polonius.patch
          git apply /tmp/kura-polonius.patch
          chmod +x bin/kr-selfhost.mjs

          npm ci --ignore-scripts
          node --check lib/self-host.mjs
          node --check bin/kr-selfhost.mjs
          npm test

          rm -rf /tmp/kura-polonius-selfhost /tmp/kura-polonius-kernel /tmp/kura-polonius-qemu /tmp/kura-polonius-package /tmp/kura-polonius-artifacts
          mkdir -p /tmp/kura-polonius-artifacts /tmp/kura-polonius-package
          node bin/kr-selfhost.mjs bootstrap /tmp/kura-polonius-selfhost > /tmp/kura-polonius-artifacts/self-host-report.json
          node bin/kr-selfhost.mjs verify /tmp/kura-polonius-selfhost > /tmp/kura-polonius-artifacts/self-host-verify.json
          grep -q '"fixedPoint": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"poloniusRegionFactsWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"loopFixedPointDataflowWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"varianceInferenceWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"pinnedGeneratorBorrowModelWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"negativeImplCheckingWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"specializationOrderingWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"recursiveAssociatedTypeProjectionWrittenInKura": true' /tmp/kura-polonius-artifacts/self-host-report.json
          grep -q '"ok": true' /tmp/kura-polonius-artifacts/self-host-verify.json

          node bin/kr-selfhost.mjs traits examples/language/polonius-specialization.kr --trait Wrapper --type 'Box<i32>' --assoc Output > /tmp/kura-polonius-artifacts/recursive-projection.json
          grep -q '1.2-kura-recursive-projection-specialization-solver' /tmp/kura-polonius-artifacts/recursive-projection.json
          grep -q '"i32"' /tmp/kura-polonius-artifacts/recursive-projection.json

          node bin/kr-selfhost.mjs traits examples/language/polonius-specialization.kr --trait Show --type 'Box<i32>' --assoc Out > /tmp/kura-polonius-artifacts/specialization.json
          grep -q '"String"' /tmp/kura-polonius-artifacts/specialization.json

          node bin/kr-selfhost.mjs traits examples/language/polonius-specialization.kr --trait Send --type Never > /tmp/kura-polonius-artifacts/negative-impl.json || true
          grep -q 'KR-SELF-TRAIT-1201' /tmp/kura-polonius-artifacts/negative-impl.json

          node bin/kr-selfhost.mjs regions examples/language/polonius-specialization.kr > /tmp/kura-polonius-artifacts/region-report.json
          grep -q '1.1-kura-polonius-loop-region-analyzer' /tmp/kura-polonius-artifacts/region-report.json
          grep -q '"converged": true' /tmp/kura-polonius-artifacts/region-report.json
          grep -q '"covariant"' /tmp/kura-polonius-artifacts/region-report.json
          grep -q '"invariant"' /tmp/kura-polonius-artifacts/region-report.json

          node bin/kr-selfhost.mjs borrow examples/language/polonius-specialization.kr > /tmp/kura-polonius-artifacts/borrow-report.json
          grep -q '2.1-kura-polonius-pin-generator-borrow-checker' /tmp/kura-polonius-artifacts/borrow-report.json
          grep -q '"ok": true' /tmp/kura-polonius-artifacts/borrow-report.json

          cat > /tmp/kura-loop-broken.kr <<'KR'
          pub fn broken(mut value: String, condition: bool) -> String {
            while condition { move value }
            return value
          }
          KR
          node bin/kr-selfhost.mjs regions /tmp/kura-loop-broken.kr > /tmp/kura-polonius-artifacts/loop-report.json || true
          grep -q 'KR-SELF-LOOP-0001' /tmp/kura-polonius-artifacts/loop-report.json

          sudo apt-get update
          sudo apt-get install -y clang lld grub-pc-bin grub-common xorriso mtools qemu-system-x86
          node bin/kr-hardware.mjs build --out-dir /tmp/kura-polonius-kernel > /tmp/kura-polonius-artifacts/kernel-build-report.json
          test -s /tmp/kura-polonius-kernel/kernel.elf
          grub-file --is-x86-multiboot2 /tmp/kura-polonius-kernel/kernel.elf
          node bin/kr-hardware.mjs qemu-smoke --out-dir /tmp/kura-polonius-qemu --timeout-ms 45000 --memory 256 --cpus 2 --json > /tmp/kura-polonius-artifacts/qemu-report.json
          grep -q '"code": 33' /tmp/kura-polonius-artifacts/qemu-report.json
          grep -q '"timedOut": false' /tmp/kura-polonius-artifacts/qemu-report.json
          grep -q 'acpi-root-and-mcfg-discovered' /tmp/kura-polonius-artifacts/qemu-report.json

          npm pack --ignore-scripts --json --pack-destination /tmp/kura-polonius-package > /tmp/kura-polonius-artifacts/pack-report.json
          test -s /tmp/kura-polonius-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-polonius-package/kura-lang-compiler-1.0.0.tgz > /tmp/kura-polonius-artifacts/package-contents.txt
          grep -q 'package/docs/SELF_HOSTED_POLONIUS_TRAITS.md' /tmp/kura-polonius-artifacts/package-contents.txt
          grep -q 'package/examples/language/polonius-specialization.kr' /tmp/kura-polonius-artifacts/package-contents.txt
          ! grep -q 'self-host.mjs.bak' /tmp/kura-polonius-artifacts/package-contents.txt

          cp /tmp/kura-polonius-package/kura-lang-compiler-1.0.0.tgz /tmp/kura-polonius-artifacts/
          cp /tmp/kura-polonius-kernel/kernel.elf /tmp/kura-polonius-artifacts/kura-polonius-kernel.elf
          cp -R /tmp/kura-polonius-qemu /tmp/kura-polonius-artifacts/qemu
          sha256sum /tmp/kura-polonius-artifacts/kura-lang-compiler-1.0.0.tgz /tmp/kura-polonius-artifacts/kura-polonius-kernel.elf /tmp/kura-polonius-qemu/kernel.iso > /tmp/kura-polonius-artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kura-polonius-traits
          path: /tmp/kura-polonius-artifacts

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patch-stage .github/workflows/apply-polonius-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Kura Polonius regions and advanced trait selection'
          git push origin HEAD:agent/system-foundation-0.1
