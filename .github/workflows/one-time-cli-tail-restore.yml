name: One-time secure CLI tail restore

on:
  push:
    branches:
      - agent/system-foundation-0.1

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Restore missing CLI implementation
        shell: bash
        run: |
          git show c64ebdff85b7d277a8e90da7f3182e59bf4fecb4:.github/workflows/one-time-cli-tail-restore.yml > /tmp/cli-tail-source.yml
          python - <<'PY'
          from pathlib import Path

          cli_path = Path('bin/kr.mjs')
          cli = cli_path.read_text(encoding='utf-8')
          if 'async function bindgenCommand' in cli:
              raise SystemExit('CLI tail already exists; refusing duplicate append.')

          archived = Path('/tmp/cli-tail-source.yml').read_text(encoding='utf-8')
          start_marker = '\nasync function bindgenCommand'
          end_marker = '\nKURA_CLI_TAIL'
          start = archived.index(start_marker) + 1
          end = archived.index(end_marker, start)
          tail = archived[start:end].rstrip()
          cli_path.write_text(cli.rstrip() + '\n\n' + tail + '\n', encoding='utf-8')
          PY

          rm .github/workflows/one-time-cli-tail-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/kr.mjs .github/workflows/one-time-cli-tail-restore.yml
          git commit -m "Restore secure CLI command implementations"
          git push origin HEAD:agent/system-foundation-0.1
