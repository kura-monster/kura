name: Apply Kura CFG region stage

on:
  pull_request:
    branches:
      - agent/cfg-region-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Apply, validate and commit CFG region stage
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f cfg-region-stage/part-00.b64 ]; then
            echo 'CFG region stage already applied.'
            exit 0
          fi

          echo '37d4c32d2e6fc1dddac517181ec16ef6d92a388c7b3fc2233ea20f80a161ba98  cfg-region-stage/part-00.b64' | sha256sum -c -
          echo '8e7b28d8d7450b0e7762c3ab70039e7e35444a8e334d2e9fa65e1930e4a8c307  cfg-region-stage/part-01.b64' | sha256sum -c -
          echo '24c3a2059f35a2211b5e432efaea24913813b140be05d546760728ba95a9fd35  cfg-region-stage/part-02.b64' | sha256sum -c -
          echo '88f92e4621096df1e0f2c681de04f3c745e067fe00de2f9f230b55a700e2048f  cfg-region-stage/part-03.b64' | sha256sum -c -
          echo 'e7d49cc55511a648901b38726e064b200e91b18bce1fb32b9ebc3cfeb2201b5d  cfg-region-stage/part-04.b64' | sha256sum -c -
          cat cfg-region-stage/part-*.b64 > /tmp/kura-cfg-region-stage.b64
          echo '3e73a079c78572b17b290ddb4ef4e8403527cac1f1384184e24e3ea44697e81e  /tmp/kura-cfg-region-stage.b64' | sha256sum -c -
          base64 --decode /tmp/kura-cfg-region-stage.b64 > /tmp/kura-cfg-region-stage.tar.xz
          echo '7058fe020ed456474378b15c7971779add82afb7b7d89b5fa471c021adc28087  /tmp/kura-cfg-region-stage.tar.xz' | sha256sum -c -
          tar -xJf /tmp/kura-cfg-region-stage.tar.xz -C .
          rm -f lib/self-host.before-advanced.mjs
          chmod +x bin/kr-selfhost.mjs

          npm ci --ignore-scripts
          node --check lib/self-host.mjs
          node --check bin/kr-selfhost.mjs
          npm test

          rm -rf /tmp/kura-selfhost-cfg /tmp/kura-cfg-kernel /tmp/kura-cfg-qemu /tmp/kura-cfg-package /tmp/kura-cfg-artifacts
          mkdir -p /tmp/kura-cfg-artifacts /tmp/kura-cfg-package
          node bin/kr-selfhost.mjs bootstrap /tmp/kura-selfhost-cfg > /tmp/kura-cfg-artifacts/self-host-report.json
          node bin/kr-selfhost.mjs verify /tmp/kura-selfhost-cfg > /tmp/kura-cfg-artifacts/self-host-verify.json
          grep -q '"fixedPoint": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"cfgConstructionWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"regionInferenceWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"reborrowCheckingWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"twoPhaseBorrowWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"closureCaptureCheckingWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"asyncBorrowCheckingWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"interproceduralLifetimeContractsWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"higherRankedTraitBoundsWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"associatedTypeProjectionWrittenInKura": true' /tmp/kura-cfg-artifacts/self-host-report.json
          grep -q '"ok": true' /tmp/kura-cfg-artifacts/self-host-verify.json
          grep -q '1.0-kura-cfg-region-analyzer' /tmp/kura-cfg-artifacts/self-host-verify.json
          grep -q '2.0-kura-cfg-region-borrow-checker' /tmp/kura-cfg-artifacts/self-host-verify.json

          node bin/kr-selfhost.mjs traits examples/language/cfg-region-borrow.kr --trait Iterator --type 'Box<i32>' --assoc Item > /tmp/kura-cfg-artifacts/trait-projection-report.json
          node bin/kr-selfhost.mjs cfg examples/language/cfg-region-borrow.kr > /tmp/kura-cfg-artifacts/cfg-region-report.json
          node bin/kr-selfhost.mjs borrow examples/language/cfg-region-borrow.kr > /tmp/kura-cfg-artifacts/borrow-report.json
          grep -q '1.1-kura-hrtb-projection-trait-solver' /tmp/kura-cfg-artifacts/trait-projection-report.json
          grep -q '"i32"' /tmp/kura-cfg-artifacts/trait-projection-report.json
          grep -q '1.0-kura-cfg-region-analyzer' /tmp/kura-cfg-artifacts/cfg-region-report.json
          grep -q '"identity"' /tmp/kura-cfg-artifacts/cfg-region-report.json
          grep -q '2.0-kura-cfg-region-borrow-checker' /tmp/kura-cfg-artifacts/borrow-report.json
          grep -q '"reserve"' /tmp/kura-cfg-artifacts/borrow-report.json
          grep -q '"activate"' /tmp/kura-cfg-artifacts/borrow-report.json

          cat > /tmp/kura-async-borrow.kr <<'KR'
          pub async fn broken(mut value: String) -> String {
            let view = &value
            await task()
            print(view)
            return value
          }
          KR
          node bin/kr-selfhost.mjs borrow /tmp/kura-async-borrow.kr > /tmp/kura-cfg-artifacts/async-borrow-report.json
          grep -q '"ok": false' /tmp/kura-cfg-artifacts/async-borrow-report.json
          grep -q 'KR-SELF-BORROW-0304' /tmp/kura-cfg-artifacts/async-borrow-report.json

          sudo apt-get update
          sudo apt-get install -y clang lld grub-pc-bin grub-common xorriso mtools qemu-system-x86
          node bin/kr-hardware.mjs build --out-dir /tmp/kura-cfg-kernel > /tmp/kura-cfg-artifacts/kernel-build-report.json
          test -s /tmp/kura-cfg-kernel/kernel.elf
          grub-file --is-x86-multiboot2 /tmp/kura-cfg-kernel/kernel.elf
          node bin/kr-hardware.mjs qemu-smoke --out-dir /tmp/kura-cfg-qemu --timeout-ms 45000 --memory 256 --cpus 2 --json > /tmp/kura-cfg-artifacts/qemu-report.json
          grep -q '"code": 33' /tmp/kura-cfg-artifacts/qemu-report.json
          grep -q '"timedOut": false' /tmp/kura-cfg-artifacts/qemu-report.json
          grep -q 'acpi-root-and-mcfg-discovered' /tmp/kura-cfg-artifacts/qemu-report.json
          test -s /tmp/kura-cfg-qemu/kernel.iso

          npm pack --ignore-scripts --json --pack-destination /tmp/kura-cfg-package > /tmp/kura-cfg-artifacts/pack-report.json
          test -s /tmp/kura-cfg-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-cfg-package/kura-lang-compiler-1.0.0.tgz > /tmp/kura-cfg-artifacts/package-contents.txt
          grep -q 'package/docs/SELF_HOSTED_CFG_REGION.md' /tmp/kura-cfg-artifacts/package-contents.txt
          grep -q 'package/examples/language/cfg-region-borrow.kr' /tmp/kura-cfg-artifacts/package-contents.txt
          grep -q 'package/test/self-host-cfg-region.mjs' /tmp/kura-cfg-artifacts/package-contents.txt || true
          ! grep -q 'self-host.before' /tmp/kura-cfg-artifacts/package-contents.txt

          cp /tmp/kura-cfg-package/kura-lang-compiler-1.0.0.tgz /tmp/kura-cfg-artifacts/
          cp /tmp/kura-cfg-kernel/kernel.elf /tmp/kura-cfg-artifacts/kura-cfg-region-kernel.elf
          cp -R /tmp/kura-cfg-qemu /tmp/kura-cfg-artifacts/qemu
          sha256sum /tmp/kura-cfg-artifacts/kura-lang-compiler-1.0.0.tgz /tmp/kura-cfg-artifacts/kura-cfg-region-kernel.elf /tmp/kura-cfg-qemu/kernel.iso > /tmp/kura-cfg-artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kura-cfg-region-borrow
          path: /tmp/kura-cfg-artifacts

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cfg-region-stage .github/workflows/apply-cfg-region-stage.yml
          rm -f lib/self-host.before-advanced.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Kura CFG region and advanced borrow analysis'
          git push origin HEAD:agent/system-foundation-0.1
