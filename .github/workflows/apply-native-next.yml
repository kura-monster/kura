name: Apply native kernel toolchain

on:
  push:
    branches:
      - agent/system-foundation-0.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Verify and apply implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/kura-chunks.sha256 <<'SUMS'
          23157734199c7da97828bd3243e36ce7fef9ec4c286f2954f7271a138bbe66a8  .kura/native-next.part-00
          d837e57c0011cadefee7b68aaa99a24c6d91e0d11d907f2dd2ac86608548023e  .kura/native-next.part-01
          9f432bad7c5ad135510a44969b5cae4374a32bd443255b8480eb84c8e45baa2b  .kura/native-next.part-02
          b297977557978df9fc3b012b1ab27fa2253ed8647084fddaf2100293cf6e9a92  .kura/native-next.part-03
          ed9c0e54048ac325650987ef5d8000c05e91c993061caee2be994735bb685737  .kura/native-next.part-04
          c0b203a51e9a73682174d17cfd1afd1e78c3e66b1f6bbb41ce4e26af1b6976ff  .kura/native-next.part-05
          5f8674ae87160bcfe76a0c2568165b8b7a6dd6482cbc978872cf99f839efe246  .kura/native-next.part-06
          28c9211f6a0d34322c5d555633e1fa93b29fd45a4900426a56169c146cd2a733  .kura/native-next.part-07-aa
          9ff44cc5e43f8824e398ca2e428f0713cd7459f58e42be5af645c94f1e18c213  .kura/native-next.part-07-ab
          55da41c80a2e7d8cd85425b5a611a69c5d7de23d3cc2f769ef9b01f5d4546460  .kura/native-next.part-07-ac
          73bbb4541c7c08cf7e7f2b0fc55d009e9cba40103bbff3f0984bfeff5f61faee  .kura/native-next.part-07-ad
          SUMS
          sha256sum --check /tmp/kura-chunks.sha256
          cat \
            .kura/native-next.part-00 \
            .kura/native-next.part-01 \
            .kura/native-next.part-02 \
            .kura/native-next.part-03 \
            .kura/native-next.part-04 \
            .kura/native-next.part-05 \
            .kura/native-next.part-06 \
            .kura/native-next.part-07-aa \
            .kura/native-next.part-07-ab \
            .kura/native-next.part-07-ac \
            .kura/native-next.part-07-ad \
            | base64 --decode > /tmp/kura-native-next-overlay.tgz
          echo "f1bea424367dd2d7772dba09ad9639e18851197ba27a1785a2ef6a9041d19705  /tmp/kura-native-next-overlay.tgz" | sha256sum --check -
          tar -xzf /tmp/kura-native-next-overlay.tgz -C .
          chmod +x bin/kr.mjs bin/kr-system.mjs

      - name: Validate Kura toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check bin/kr.mjs
          node --check bin/kr-system.mjs
          node --check lib/compiler.mjs
          node --check lib/system-native-compiler.mjs
          node --check lib/system-native-toolchain.mjs
          npm test
          node bin/kr-system.mjs check examples/system/kernel-next.kr
          node bin/kr-system.mjs build examples/system/minimal-kernel.kr --out-dir /tmp/kura-native-build
          npm pack --dry-run --json --ignore-scripts > /tmp/kura-pack.json

      - name: Commit directly to the working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-native-next.yml
          rm -f .kura/native-next.part-*
          rmdir .kura 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native globals and kernel toolchain"
          git push origin HEAD:agent/system-foundation-0.1
