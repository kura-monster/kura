name: Apply native kernel toolchain

on:
  push:
    branches:
      - agent/system-foundation-0.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Verify and apply implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          wc -c .kura/native-next.part-*
          sha256sum .kura/native-next.part-*
          cat .kura/native-next.part-* | base64 --decode > /tmp/kura-native-next-overlay.tgz
          echo "f1bea424367dd2d7772dba09ad9639e18851197ba27a1785a2ef6a9041d19705  /tmp/kura-native-next-overlay.tgz" | sha256sum --check -
          tar -xzf /tmp/kura-native-next-overlay.tgz -C .
          chmod +x bin/kr.mjs bin/kr-system.mjs

      - name: Validate Kura toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check bin/kr.mjs
          node --check bin/kr-system.mjs
          node --check lib/compiler.mjs
          node --check lib/system-native-compiler.mjs
          node --check lib/system-native-toolchain.mjs
          npm test
          node bin/kr-system.mjs check examples/system/kernel-next.kr
          node bin/kr-system.mjs build examples/system/minimal-kernel.kr --out-dir /tmp/kura-native-build
          npm pack --dry-run --json --ignore-scripts > /tmp/kura-pack.json

      - name: Commit directly to the working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-native-next.yml
          rm -f .kura/native-next.part-*
          rmdir .kura 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add native globals and kernel toolchain"
          git push origin HEAD:agent/system-foundation-0.1
