name: One-time system IR parameter fix

on:
  push:
    branches:
      - agent/system-foundation-0.1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Register function parameters as IR values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/system.mjs')
          source = path.read_text(encoding='utf-8')
          broken = '    const values = new Map();'
          fixed = '''    const values = new Map(fn.parameters.map(parameter => [
      parameter.name,
      { type: parameter.type, reference: parameter.name },
    ]));'''
          if source.count(broken) != 1:
              raise SystemExit('Expected one IR value-map initialization; refusing ambiguous edit.')
          path.write_text(source.replace(broken, fixed, 1), encoding='utf-8')
          PY

          rm .github/workflows/one-time-system-ir-parameter-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/system.mjs .github/workflows/one-time-system-ir-parameter-fix.yml
          git commit -m "Resolve system IR function parameters"
          git push origin HEAD:agent/system-foundation-0.1
