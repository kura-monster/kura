name: Apply platform firmware and self-host AST stage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Verify and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '9c69ed9baacff236f542c23eea70f245fe83a8cd371b6b37ae2a5ae5dda9a556  platform-ast-stage/part-00.b64' | sha256sum -c -
          echo '75180ff40721d054d877600bab3004f0f2e14775dfa7dde1a687305a9d1a5041  platform-ast-stage/part-01.b64' | sha256sum -c -
          echo '903acad8075bda59ac96ca88ed0effc6995ec9c231cb16b5dcc5dd46899449fd  platform-ast-stage/part-02.b64' | sha256sum -c -
          echo '14674901aca8d2e63e8fb8091d972057953b7d65317f52c80dcd69048d183f86  platform-ast-stage/part-03.b64' | sha256sum -c -
          cat platform-ast-stage/part-00.b64 platform-ast-stage/part-01.b64 platform-ast-stage/part-02.b64 platform-ast-stage/part-03.b64 > /tmp/kura-platform-ast.b64
          echo 'fb201874c2d3cc2a6e90324c397875ee5a17216eb99e1d9d5dba926de50ff7f1  /tmp/kura-platform-ast.b64' | sha256sum -c -
          base64 --decode /tmp/kura-platform-ast.b64 > /tmp/kura-platform-ast.tar.xz
          echo '2a86b2297b18054a3cf787cf89f8f33242304f2a829d8b14f216acc08012515b  /tmp/kura-platform-ast.tar.xz' | sha256sum -c -
          tar -xJf /tmp/kura-platform-ast.tar.xz -C .
          python - <<'PYFIX'
          from pathlib import Path

          hardware = Path('lib/system-hardware.mjs')
          source = hardware.read_text()
          old = """export async function runHardwareQemuSmoke(options = {}) {
            const outDir = options.outDir ?? 'build/hardware-qemu-smoke';
            const build = await buildHardwareKernel(createCompleteHardwareKernelSource({ ...options, smoke: true }), { ...options, outDir, smoke: true });
            const iso = await createBootableIso(build.plan.elf, { ...options, plan: build.plan, title: 'Kura Hardware Firmware Smoke' });
            const run = await runNativeKernelQemuSmoke(build.plan.iso, { ...options, memory: options.memory ?? 256, cpus: options.cpus ?? 2, timeoutMs: options.timeoutMs ?? 30000, smokeExitCode: options.smokeExitCode ?? 0x10 });
            return { build, iso, run, outputs: build.plan };
          }
          """
          new = """export async function runHardwareQemuSmoke(options = {}) {
            const outDir = path.resolve(options.outDir ?? 'build/hardware-qemu-smoke');
            const build = await buildHardwareKernel(createCompleteHardwareKernelSource({ ...options, smoke: true }), { ...options, outDir, smoke: true });
            const isoPlan = {
              ...build.plan,
              outDir,
              isoRoot: path.join(outDir, 'iso-root'),
              iso: path.join(outDir, 'kernel.iso'),
            };
            const iso = await createBootableIso(build.plan.elf, { ...options, plan: isoPlan, title: 'Kura Hardware Firmware Smoke' });
            const run = await runNativeKernelQemuSmoke(isoPlan.iso, { ...options, memory: options.memory ?? 256, cpus: options.cpus ?? 2, timeoutMs: options.timeoutMs ?? 30000, smokeExitCode: options.smokeExitCode ?? 0x10 });
            return { build, iso, run, outputs: isoPlan };
          }
          """
          if old not in source:
              raise SystemExit('runHardwareQemuSmoke block was not found')
          hardware.write_text(source.replace(old, new))

          test = Path('test/system-platform-firmware.mjs')
          source = test.read_text()
          source = source.replace(
              "import { createPlatformFirmwareManifest, createPlatformFirmwareKernelSource, platformFirmwareSmokeTest, parsePciCapabilities } from '../lib/system-platform-firmware.mjs';",
              "import { createPlatformFirmwareManifest, createPlatformFirmwareKernelSource, platformFirmwareSmokeTest, parsePciCapabilities } from '../lib/system-platform-firmware.mjs';\nimport { runHardwareQemuSmoke } from '../lib/system-hardware.mjs';",
          )
          source = source.replace(
              "assert.equal(parsePciCapabilities(config).extended[0].id, 1);\nconsole.log('platform firmware tests passed');",
              "assert.equal(parsePciCapabilities(config).extended[0].id, 1);\nconst qemu = await runHardwareQemuSmoke({ outDir: '/tmp/kura-platform-firmware-qemu-plan', dryRun: true });\nassert.equal(qemu.outputs.isoRoot, '/tmp/kura-platform-firmware-qemu-plan/iso-root');\nassert.equal(qemu.outputs.iso, '/tmp/kura-platform-firmware-qemu-plan/kernel.iso');\nassert.deepEqual(qemu.iso.step.args, ['-o', qemu.outputs.iso, qemu.outputs.isoRoot]);\nassert.equal(qemu.run.args.at(-1), qemu.outputs.iso);\nconsole.log('platform firmware tests passed');",
          )
          test.write_text(source)

          persistent = Path('.github/workflows/qemu-hardware-smoke.yml')
          persistent.write_text(persistent.read_text().replace(
              'grub-pc-bin grub-common xorriso qemu-system-x86',
              'grub-pc-bin grub-common xorriso mtools qemu-system-x86',
          ))
          PYFIX
          chmod +x bin/kr-hardware.mjs bin/kr-selfhost.mjs

      - name: Install compiler and QEMU toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Validate AST frontend and platform firmware
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check lib/self-host.mjs
          node --check lib/system-platform-firmware.mjs
          node --check lib/system-hardware-runtime.mjs
          node --check lib/system-hardware.mjs
          node --check bin/kr-hardware.mjs
          npm test
          node bin/kr-selfhost.mjs bootstrap /tmp/kura-selfhost-ast > /tmp/kura-selfhost-bootstrap.json
          node bin/kr-selfhost.mjs verify /tmp/kura-selfhost-ast > /tmp/kura-selfhost-verify.json
          node bin/kr-hardware.mjs firmware-smoke > /tmp/kura-firmware-smoke.json
          node bin/kr-hardware.mjs kernel -o /tmp/kura-platform-kernel.kr
          node bin/kr-system.mjs check /tmp/kura-platform-kernel.kr
          node bin/kr-hardware.mjs build --out-dir /tmp/kura-platform-kernel
          test -s /tmp/kura-platform-kernel/kernel.elf
          grub-file --is-x86-multiboot2 /tmp/kura-platform-kernel/kernel.elf
          nm /tmp/kura-platform-kernel/kernel.elf > /tmp/kura-platform-symbols.txt
          grep -q 'kura_boot_entry' /tmp/kura-platform-symbols.txt
          grep -q 'kernel_main' /tmp/kura-platform-symbols.txt
          grep -q 'init_platform_firmware' /tmp/kura-platform-symbols.txt
          grep -q 'pcie_ecam_address' /tmp/kura-platform-symbols.txt
          grep -q 'pci_find_capability' /tmp/kura-platform-symbols.txt
          grep -q 'vtd_enable_translation' /tmp/kura-platform-symbols.txt
          grep -q 'amdvi_enable_translation' /tmp/kura-platform-symbols.txt
          node bin/kr-hardware.mjs qemu-smoke --out-dir /tmp/kura-qemu-platform --timeout-ms 45000 --memory 256 --cpus 2 --json > /tmp/kura-qemu-report.json
          grep -q '"timedOut": false' /tmp/kura-qemu-report.json
          test -s /tmp/kura-qemu-platform/kernel.iso
          test -s /tmp/kura-qemu-platform/iso-root/boot/kernel.elf
          test -s /tmp/kura-qemu-platform/iso-root/boot/grub/grub.cfg
          mkdir -p /tmp/kura-package
          npm pack --ignore-scripts --json --pack-destination /tmp/kura-package > /tmp/kura-pack.json
          test -s /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz > /tmp/kura-package-contents.txt
          grep -q 'package/lib/system-platform-firmware.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/docs/PLATFORM_FIRMWARE.md' /tmp/kura-package-contents.txt
          grep -q 'package/lib/self-host.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/bin/kr-hardware.mjs' /tmp/kura-package-contents.txt

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kura-platform-ast-stage
          path: |
            /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
            /tmp/kura-selfhost-ast/self-host-report.json
            /tmp/kura-platform-kernel/kernel.elf
            /tmp/kura-qemu-platform/kernel.iso
            /tmp/kura-qemu-report.json
            /tmp/kura-firmware-smoke.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit directly to working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf platform-ast-stage
          rm -f .github/workflows/apply-platform-ast-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ACPI ECAM IOMMU and self-host AST frontend'
          git push origin HEAD:agent/system-foundation-0.1
