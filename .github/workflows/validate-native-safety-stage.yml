name: Validate native safety stage

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Verify and extract safety implementation
        shell: bash
        run: |
          set -euo pipefail
          echo 'de084b1a40b298855cf899ee5c9be0d056bb4b28b66f01bfb48b8261cbef70bc  safety-stage/part-00.b64' | sha256sum -c -
          echo '61d7d1a2c80d14f112144c66b90a2cc717bcfcede3a28110511821c0a9679ebe  safety-stage/part-01.b64' | sha256sum -c -
          echo 'aca82c42a8846a527648168c2c2d593a97ac09b9f3f3d04c269038991a75db3d  safety-stage/part-02.b64' | sha256sum -c -
          echo '4fc070abe5a9cd9ecbe223d8a7daae00aac4dde11fc285e2f46f3778381c58e6  safety-stage/part-03.b64' | sha256sum -c -
          cat safety-stage/part-*.b64 > /tmp/kura-safety-stage.b64
          echo 'ce337d705fae848426f46561d190a6f0b766f5d63a77111849413c90208297bd  /tmp/kura-safety-stage.b64' | sha256sum -c -
          base64 --decode /tmp/kura-safety-stage.b64 > /tmp/kura-safety-stage.tgz
          echo 'bd652fc4f886d71ced41b7934dafabb375363cd9e6d85a975da691584bc6e7a0  /tmp/kura-safety-stage.tgz' | sha256sum -c -
          tar -xzf /tmp/kura-safety-stage.tgz -C .
          python scripts/apply-native-safety-stage.py
          chmod +x bin/kr-safety.mjs

      - name: Run safety and package validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check lib/system-native-safety.mjs
          node --check lib/system-native-ownership-intrinsics.mjs
          node --check bin/kr-safety.mjs
          node --check test/system-native-safety.mjs
          npm test
          node bin/kr-safety.mjs check examples/system/ownership-safety.kr --deny-undocumented-unsafe
          node bin/kr-safety.mjs audit examples/system/ownership-safety.kr --json --deny-undocumented-unsafe > /tmp/kura-native-safety-report.json
          node bin/kr-safety.mjs traits examples/system/ownership-safety.kr --json > /tmp/kura-native-safety-traits.json
          node bin/kr-system.mjs check examples/system/ownership-safety.kr
          mkdir -p /tmp/kura-package
          npm pack --ignore-scripts --json --pack-destination /tmp/kura-package > /tmp/kura-pack.json
          test -s /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz | grep -q package/lib/system-native-safety.mjs
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz | grep -q package/bin/kr-safety.mjs
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz | grep -q package/docs/NATIVE_SAFETY.md

      - name: Upload Kura TGZ
        uses: actions/upload-artifact@v4
        with:
          name: kura-native-safety-tgz
          path: |
            /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
            /tmp/kura-native-safety-report.json
            /tmp/kura-native-safety-traits.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit directly to working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf safety-stage
          rm -f .github/workflows/validate-native-safety-stage.yml
          rm -f scripts/apply-native-safety-stage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add native ownership borrow checking and safety audits'
          git push origin HEAD:agent/system-foundation-0.1
