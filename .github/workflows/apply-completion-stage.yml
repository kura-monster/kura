name: Apply complete language and userspace stage

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Verify and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          echo 'efbc1763c8f53c7eb2104af696a94024c0cef70e29aee4c99b37e39d0488477c  completion-stage/part-00.b64' | sha256sum -c -
          echo '1b05d99f7f863369d281c75d431c789a690147be2111d95163563389846bdde1  completion-stage/part-01.b64' | sha256sum -c -
          echo 'd531d72276761429ab5db4abc1760ba02fb636d1f92b97f3454626a3ceaea26d  completion-stage/part-02-00.b64' | sha256sum -c -
          echo '0092a03d527894787e6039bfbd0d37fc9949e749ad7b5f2759298bf7133aa38f  completion-stage/part-02-01.b64' | sha256sum -c -
          echo '03163270ad7d996212b00e267360519980a738ca7e5b5b77bc3eb1a53218bcc9  completion-stage/part-02-02.b64' | sha256sum -c -
          echo '4682ba9dd5dd55dc980f557c003cb65cabc3d535bed5c7dfe77ea739f617de7a  completion-stage/part-02-03.b64' | sha256sum -c -
          echo '5948cf1b05a694c672af3bd986177d3a6d0da2308f9ecfbb6715e20d1e8dedce  completion-stage/part-02-04.b64' | sha256sum -c -
          cat completion-stage/part-00.b64 completion-stage/part-01.b64 completion-stage/part-02-00.b64 completion-stage/part-02-01.b64 completion-stage/part-02-02.b64 completion-stage/part-02-03.b64 completion-stage/part-02-04.b64 > /tmp/kura-completion.b64
          echo '4b2ad23ab262f6d606be24dbcc127ddc8a969ec0da529b0373d8b1fc8b7a438b  /tmp/kura-completion.b64' | sha256sum -c -
          base64 --decode /tmp/kura-completion.b64 > /tmp/kura-completion.tar.xz
          echo '86e9debd1a0b97650669778044a4be6f3663fa5a13aa41047023f31ce855d9a3  /tmp/kura-completion.tar.xz' | sha256sum -c -
          tar -xJf /tmp/kura-completion.tar.xz -C .
          chmod +x bin/kr-native-language.mjs bin/kr-async.mjs bin/kr-dev.mjs bin/kr-userspace.mjs bin/kr-selfhost.mjs

      - name: Validate language, async, userspace, and self-hosting
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check lib/language-native-backend.mjs
          node --check lib/async-runtime.mjs
          node --check lib/developer-toolchain.mjs
          node --check lib/system-userspace.mjs
          node --check lib/self-host.mjs
          node --check bin/kr-native-language.mjs
          node --check bin/kr-async.mjs
          node --check bin/kr-dev.mjs
          node --check bin/kr-userspace.mjs
          node --check bin/kr-selfhost.mjs
          npm test
          node bin/kr-native-language.mjs check examples/language/native-complete.kr
          node bin/kr-native-language.mjs object examples/language/native-complete.kr -o /tmp/kura-native-language.o
          test -s /tmp/kura-native-language.o
          node bin/kr-async.mjs smoke
          node bin/kr-selfhost.mjs bootstrap /tmp/kura-selfhost
          node bin/kr-selfhost.mjs verify /tmp/kura-selfhost
          node bin/kr-userspace.mjs build --out-dir /tmp/kura-userspace
          test -s /tmp/kura-userspace/kernel.elf
          nm /tmp/kura-userspace/kernel.elf > /tmp/kura-userspace-symbols.txt
          grep -q 'kura_boot_entry' /tmp/kura-userspace-symbols.txt
          grep -q 'kernel_main' /tmp/kura-userspace-symbols.txt
          grep -q 'kura_syscall_entry' /tmp/kura-userspace-symbols.txt
          grep -q 'kura_enter_userspace' /tmp/kura-userspace-symbols.txt
          grep -q 'kura_syscall_dispatch' /tmp/kura-userspace-symbols.txt
          mkdir -p /tmp/kura-package
          npm pack --ignore-scripts --json --pack-destination /tmp/kura-package > /tmp/kura-pack.json
          test -s /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz > /tmp/kura-package-contents.txt
          grep -q 'package/lib/language-native-backend.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/lib/async-runtime.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/lib/developer-toolchain.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/lib/system-userspace.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/lib/self-host.mjs' /tmp/kura-package-contents.txt
          grep -q 'package/bin/kr-selfhost.mjs' /tmp/kura-package-contents.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kura-complete-language-userspace-tgz
          path: |
            /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
            /tmp/kura-selfhost/self-host-report.json
            /tmp/kura-userspace/kernel.elf
          if-no-files-found: error
          retention-days: 30

      - name: Commit directly to working branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf completion-stage
          rm -f .github/workflows/apply-completion-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete native async userspace and self-host foundation'
          git push origin HEAD:agent/system-foundation-0.1
