name: Apply advanced traits and borrow stage

on:
  pull_request:
    branches:
      - agent/advanced-traits-borrow-validation-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Apply, validate and commit advanced traits and borrow stage
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f advanced-stage/part-00.b64 ]; then
            echo 'Advanced stage already applied.'
            exit 0
          fi

          echo '24a3e2524ce9ad705feb45c5f51f34f1af54fd15596871b1414a600d33a0e2f1  advanced-stage/part-00.b64' | sha256sum -c -
          echo '860537a6501336929647dc0deed2e8a8c7e8d0eac57744ec9a654cab528369b6  advanced-stage/part-01.b64' | sha256sum -c -
          echo '2537f77e58117b66a5b0db31b4afd35924cb329702670978c59adb0a105f41f9  advanced-stage/part-02.b64' | sha256sum -c -
          echo 'ae2c7fbbb1a4912848560c5f0e457b0ced10a7df1d6848a8abd3c564dd9e52ff  advanced-stage/part-03.b64' | sha256sum -c -
          echo 'eade0b2092f098cd139ee745b641f61f910072ef7bc0fea4fa7f5fdd0cbbb7de  advanced-stage/part-04.b64' | sha256sum -c -
          echo '730d2b1fc5f103000263707dbe482e1603ab1a96a0052887318cdd2aa31fe3e9  advanced-stage/part-05.b64' | sha256sum -c -
          echo '1d66c6403ae3d164483518adba0d08bc71229f681bb0ecbfc0bbe4efb5599955  advanced-stage/part-06.b64' | sha256sum -c -
          cat advanced-stage/part-*.b64 > /tmp/kura-advanced-stage.b64
          echo '26a94f6a917162899b71438cdd694d454cf4193fa2dcb12bfc438d4b3ee941d9  /tmp/kura-advanced-stage.b64' | sha256sum -c -
          base64 --decode /tmp/kura-advanced-stage.b64 > /tmp/kura-advanced-stage.tar.xz
          echo '91caa1ccc6dd14fe01ac362f900752dfef789b42b869f7584f2757603b2b1d85  /tmp/kura-advanced-stage.tar.xz' | sha256sum -c -
          tar -xJf /tmp/kura-advanced-stage.tar.xz -C .
          chmod +x bin/kr-selfhost.mjs

          npm ci --ignore-scripts
          node --check lib/self-host.mjs
          node --check bin/kr-selfhost.mjs
          npm test

          rm -rf /tmp/kura-selfhost-advanced /tmp/kura-advanced-kernel /tmp/kura-advanced-qemu /tmp/kura-package
          node bin/kr-selfhost.mjs bootstrap /tmp/kura-selfhost-advanced > /tmp/kura-bootstrap.json
          node bin/kr-selfhost.mjs verify /tmp/kura-selfhost-advanced > /tmp/kura-verify.json
          grep -q '"fixedPoint": true' /tmp/kura-bootstrap.json
          grep -q '"associatedTypeSolverWrittenInKura": true' /tmp/kura-bootstrap.json
          grep -q '"pathSensitiveBorrowCheckerWrittenInKura": true' /tmp/kura-bootstrap.json
          grep -q '"ok": true' /tmp/kura-verify.json

          node bin/kr-selfhost.mjs traits examples/language/associated-borrow.kr --trait Iterator --type Numbers > /tmp/kura-traits.json
          node bin/kr-selfhost.mjs borrow examples/language/associated-borrow.kr > /tmp/kura-borrow.json
          grep -q '1.0-kura-associated-trait-solver' /tmp/kura-traits.json
          grep -q '"ok": true' /tmp/kura-traits.json
          grep -q '1.0-kura-path-nll-borrow-checker' /tmp/kura-borrow.json
          grep -q '"ok": true' /tmp/kura-borrow.json

          sudo apt-get update
          sudo apt-get install -y clang lld grub-pc-bin grub-common xorriso mtools qemu-system-x86
          node bin/kr-hardware.mjs build --out-dir /tmp/kura-advanced-kernel > /tmp/kura-kernel.json
          test -s /tmp/kura-advanced-kernel/kernel.elf
          grub-file --is-x86-multiboot2 /tmp/kura-advanced-kernel/kernel.elf
          node bin/kr-hardware.mjs qemu-smoke --out-dir /tmp/kura-advanced-qemu --timeout-ms 45000 --memory 256 --cpus 2 --json > /tmp/kura-qemu.json
          grep -q '"code": 33' /tmp/kura-qemu.json
          grep -q 'acpi-root-and-mcfg-discovered' /tmp/kura-qemu.json

          mkdir -p /tmp/kura-package
          npm pack --ignore-scripts --json --pack-destination /tmp/kura-package > /tmp/kura-pack.json
          test -s /tmp/kura-package/kura-lang-compiler-1.0.0.tgz
          tar -tzf /tmp/kura-package/kura-lang-compiler-1.0.0.tgz > /tmp/kura-package-contents.txt
          grep -q 'package/docs/SELF_HOSTED_TRAITS_BORROW.md' /tmp/kura-package-contents.txt
          grep -q 'package/examples/language/associated-borrow.kr' /tmp/kura-package-contents.txt

          rm -rf advanced-stage .github/workflows/apply-advanced-traits-borrow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Kura associated traits and path-sensitive borrow core'
          git push origin HEAD:agent/system-foundation-0.1
