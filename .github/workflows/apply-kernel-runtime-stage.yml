name: Validate x86_64 bootable kernel

on:
  push:
    branches:
      - agent/system-foundation-0.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Validate bootable kernel pipeline
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check bin/kr-system.mjs
          node --check lib/system-native-intrinsics.mjs
          node --check lib/system-native-toolchain.mjs
          node --check lib/system-kernel-runtime.mjs
          npm test
          node bin/kr-system.mjs check examples/system/kernel-runtime.kr
          node bin/kr-system.mjs check examples/system/qemu-smoke.kr
          node bin/kr-system.mjs architecture --json > /tmp/kura-architecture.json
          node bin/kr-system.mjs bootstrap -o /tmp/kura-bootstrap.S
          node bin/kr-system.mjs build-bootable examples/system/qemu-smoke.kr --out-dir /tmp/kura-kernel-build
          test -s /tmp/kura-kernel-build/qemu-smoke.o
          test -s /tmp/kura-kernel-build/kura-bootstrap.o
          test -s /tmp/kura-kernel-build/qemu-smoke.elf
          readelf -h /tmp/kura-kernel-build/qemu-smoke.elf
          readelf -S /tmp/kura-kernel-build/qemu-smoke.elf
          nm /tmp/kura-kernel-build/qemu-smoke.elf | grep -E 'kura_boot_entry|kernel_main'
          node bin/kr-system.mjs qemu-smoke examples/system/qemu-smoke.kr --out-dir /tmp/kura-qemu-plan --dry-run --json > /tmp/kura-qemu-plan.json
          npm pack --dry-run --json --ignore-scripts > /tmp/kura-pack.json

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-kernel-runtime-stage.yml
          rm -rf .kura-stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize bootable x86_64 kernel runtime"
          git push origin HEAD:agent/system-foundation-0.1
