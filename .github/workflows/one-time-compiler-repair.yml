name: One-time compiler repair

on:
  push:
    branches:
      - agent/system-foundation-0.1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Repair compiler map expression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/compiler.mjs')
          source = path.read_text(encoding='utf-8')
          broken = "const body = ast.body.map((x => emitStatement(x, 0)).join(options.compact ? '\\n' : '\\n\\n');"
          fixed = "const body = ast.body.map(x => emitStatement(x, 0)).join(options.compact ? '\\n' : '\\n\\n');"
          if broken not in source:
              raise SystemExit('Expected compiler syntax typo was not found; refusing an unrelated edit.')
          path.write_text(source.replace(broken, fixed, 1), encoding='utf-8')
          PY

          rm .github/workflows/one-time-compiler-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/compiler.mjs .github/workflows/one-time-compiler-repair.yml
          git commit -m "Fix compiler statement emission syntax"
          git push origin HEAD:agent/system-foundation-0.1
