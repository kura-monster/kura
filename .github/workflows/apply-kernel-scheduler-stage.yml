name: Apply kernel scheduler stage

on:
  push:
    branches:
      - agent/system-foundation-0.1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-foundation-0.1
          fetch-depth: 0

      - name: Connect scheduler compiler and package surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          intrinsics = Path('lib/system-native-intrinsics.mjs')
          source = intrinsics.read_text(encoding='utf-8')
          import_line = "import { compileSchedulerIntrinsic } from './system-native-atomics.mjs';\n"
          anchor = "import { fail, isPointer, safeName } from './system-native-common.mjs';\n"
          if import_line not in source:
              if anchor not in source:
                  raise SystemExit('Native intrinsic import anchor is missing.')
              source = source.replace(anchor, anchor + import_line, 1)
          call = "  const schedulerIntrinsic = compileSchedulerIntrinsic(emitter, expression, path);\n  if (schedulerIntrinsic) return schedulerIntrinsic;\n"
          path_anchor = "  const path = pathName(expression.callee);\n"
          if call not in source:
              if source.count(path_anchor) != 1:
                  raise SystemExit('Native intrinsic dispatch anchor is ambiguous.')
              source = source.replace(path_anchor, path_anchor + call, 1)
          intrinsics.write_text(source, encoding='utf-8')

          exports = Path('lib/system-native.mjs')
          source = exports.read_text(encoding='utf-8')
          block = """export {
            DEFAULT_KERNEL_SCHEDULER_LAYOUT,
            createKernelSchedulerManifest,
            parseAcpiHpet,
            TicketSpinLockModel,
            SlabAllocatorModel,
            PriorityRoundRobinSchedulerModel,
            createContextSwitchAssembly,
            createKernelSchedulerSource,
            createSchedulerBuildPlan,
            emitSchedulerSupportObject,
            buildSchedulerKernel,
          } from './system-kernel-scheduler.mjs';
          """
          block = '\n'.join(line.strip() if index == 0 else line[10:] if line.startswith('          ') else line for index, line in enumerate(block.splitlines())) + '\n'
          if "from './system-kernel-scheduler.mjs';" not in source:
              source += block
          exports.write_text(source, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['description'] = 'Kura v1 compiler with AI, LSP, native x86_64 SMP, memory management, and a scheduled kernel runtime'
          package.setdefault('bin', {})['kr-scheduler'] = 'bin/kr-scheduler.mjs'
          package.setdefault('exports', {})['./system/kernel-scheduler'] = './lib/system-kernel-scheduler.mjs'
          keywords = package.setdefault('keywords', [])
          for keyword in ['spinlock', 'hpet', 'lapic-timer', 'slab-allocator', 'kernel-thread', 'context-switch', 'scheduler', 'per-cpu']:
              if keyword not in keywords:
                  keywords.append(keyword)
          scripts = package.setdefault('scripts', {})
          scheduler_test = 'node test/system-kernel-scheduler.mjs'
          if scheduler_test not in scripts['test']:
              scripts['test'] += ' && ' + scheduler_test
          for key in ['test:system', 'test:native', 'test:system-next']:
              if key in scripts and scheduler_test not in scripts[key]:
                  scripts[key] += ' && ' + scheduler_test
          scripts['test:kernel-scheduler'] = scheduler_test
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          root = lock['packages']['']
          root.setdefault('bin', {})['kr-kernel'] = 'bin/kr-kernel.mjs'
          root['bin']['kr-scheduler'] = 'bin/kr-scheduler.mjs'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY
          chmod +x bin/kr-scheduler.mjs

      - name: Validate scheduler source and native ELF
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check lib/system-native-atomics.mjs
          node --check lib/system-kernel-scheduler.mjs
          node --check bin/kr-scheduler.mjs
          node --check test/system-kernel-scheduler.mjs
          npm test
          node bin/kr-scheduler.mjs manifest --json > /tmp/kura-scheduler-manifest.json
          node bin/kr-scheduler.mjs emit --smoke --cpus 2 -o /tmp/kura-scheduler-smoke.kr
          node bin/kr-system.mjs check /tmp/kura-scheduler-smoke.kr
          node bin/kr-scheduler.mjs build-generated --smoke --cpus 2 --out-dir /tmp/kura-scheduler-build
          test -s /tmp/kura-scheduler-build/kernel.ll
          test -s /tmp/kura-scheduler-build/kernel.o
          test -s /tmp/kura-scheduler-build/kura-bootstrap.o
          test -s /tmp/kura-scheduler-build/kura-context-switch.o
          test -s /tmp/kura-scheduler-build/kernel.elf
          readelf -h /tmp/kura-scheduler-build/kernel.elf
          readelf -s /tmp/kura-scheduler-build/kernel.elf | grep -q kura_boot_entry
          readelf -s /tmp/kura-scheduler-build/kernel.elf | grep -q kernel_main
          readelf -s /tmp/kura-scheduler-build/kernel.elf | grep -q kura_ap_main
          readelf -s /tmp/kura-scheduler-build/kernel.elf | grep -q kura_context_switch
          node bin/kr-scheduler.mjs smoke /tmp/kura-scheduler-smoke.kr --cpus 2 --out-dir /tmp/kura-scheduler-qemu --dry-run > /tmp/kura-scheduler-qemu.json
          npm pack --dry-run --json --ignore-scripts > /tmp/kura-scheduler-pack.json

      - name: Commit directly to scheduler branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-kernel-scheduler-stage.yml
          rm -f scheduler-stage-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add synchronized kernel threads and scheduler"
          git push origin HEAD:agent/system-foundation-0.1
