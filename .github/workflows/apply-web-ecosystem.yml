name: Apply Web ecosystem payload

on:
  push:
    branches:
      - agent/web-ecosystem-completion
    paths:
      - .github/workflows/apply-web-ecosystem.yml
  pull_request:
    branches:
      - agent/web-application-platform
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .kura-transfer/web.part01 \
            .kura-transfer/web.part02 \
            .kura-transfer/web.part03 \
            .kura-transfer/web.part04.fix01 \
            .kura-transfer/web.part04.fix02 \
            .kura-transfer/web.part04.fix03 \
            .kura-transfer/web.part04.fix04 \
            .kura-transfer/web.part04.fix05 \
            .kura-transfer/web.part05 \
            .kura-transfer/web.part06 \
            .kura-transfer/web.part07 \
            .kura-transfer/web.part08 \
            .kura-transfer/web.part09 \
            .kura-transfer/web.part10.fix01 \
            .kura-transfer/web.part10.fix02 \
            .kura-transfer/web.part10.fix03 \
            .kura-transfer/web.part10.fix04 \
            .kura-transfer/web.part10.fix05 \
            .kura-transfer/web.part11 \
            .kura-transfer/web.part12.fix01 \
            .kura-transfer/web.part12.fix02 \
            .kura-transfer/web.part12.fix03 \
            .kura-transfer/web.part12.fix04 \
            .kura-transfer/web.part12.fix05 \
            > /tmp/web-ecosystem.b64
          base64 --decode /tmp/web-ecosystem.b64 > /tmp/web-ecosystem.tar.gz
          echo "0e25a0b5b6837e5526abeece271fca23d1b435302e72810b5be15825ab09dbee  /tmp/web-ecosystem.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/web-ecosystem.tar.gz
          tar -xzf /tmp/web-ecosystem.tar.gz

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run --json > /tmp/npm-pack.json
          node bin/kr.mjs --version
          node bin/kr.mjs doctor
          node bin/kr.mjs security status
          node bin/kr-web.mjs --version

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kura-transfer
          git rm .github/workflows/apply-web-ecosystem.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Kura full-stack Web ecosystem"
          git push origin HEAD:agent/web-ecosystem-completion
