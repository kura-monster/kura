<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kura member profile with Discord roles and animations.">
    <title>Kura — Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Times New Roman", Times, Georgia, serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid #000;
            padding: 22px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-title {
            font-size: 1.7rem;
            font-style: italic;
            letter-spacing: 4px;
        }

        nav { display: flex; gap: 24px; flex-wrap: wrap; }
        nav a {
            color: #000;
            text-decoration: none;
            font-size: 0.88rem;
            padding: 4px 0;
            border-bottom: 1px solid transparent;
            transition: all 0.25s ease;
        }
        nav a:hover {
            border-bottom: 1px solid #000;
            font-style: italic;
        }
        nav a:visited { color: #000; }

        main {
            flex: 1;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 40px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: lowercase;
            margin-bottom: 18px;
            color: #333;
            font-style: italic;
        }

        hr { border: none; border-top: 1px solid #000; margin: 24px 0; }
        hr.double { border: none; border-top: 3px double #000; }

        .profile-card {
            border: 1px solid #000;
            padding: 36px 40px;
            margin: 24px 0;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #000;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
            animation: avatarPulse 2s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .profile-info h2 {
            font-size: 1.8rem;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .profile-info p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 4px;
            font-style: italic;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .stat-line:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-weight: normal;
            color: #666;
            font-style: italic;
        }

        .stat-value {
            font-family: "Courier New", monospace;
            font-weight: bold;
        }

        /* ── ロール表示 ── */
        .roles-section {
            margin-top: 28px;
        }

        .roles-section h3 {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        .roles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .role-badge {
            padding: 10px 16px;
            border: 2px solid #000;
            border-radius: 4px;
            font-size: 0.9rem;
            font-style: italic;
            letter-spacing: 1px;
            animation: roleBounce 0.6s ease-out;
            transition: all 0.3s ease;
        }

        .role-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        @keyframes roleBounce {
            0% { transform: translateY(10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* ── バランス表示 ── */
        .balance-box {
            border: 1px solid #000;
            padding: 20px 28px;
            margin: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            animation: balanceFade 0.8s ease-in;
        }

        @keyframes balanceFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .balance-label {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #666;
            text-transform: uppercase;
            font-style: italic;
        }

        .balance-value {
            font-family: "Courier New", Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: 1px solid #000;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-style: italic;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: #000;
            color: #fff;
        }

        .btn-primary {
            flex: 1;
            min-width: 120px;
        }

        .btn-secondary {
            background: #f5f5f5;
        }

        .btn-secondary:hover {
            background: #000;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #c00;
            font-style: italic;
        }

        footer {
            border-top: 1px solid #000;
            padding: 24px 40px;
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            font-style: italic;
            background: #fff;
        }

        /* 小画面対応 */
        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .profile-avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }
            .action-buttons {
                flex-direction: column;
            }
            .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header id="site-header">
        <div class="site-title">— Kura —</div>
        <nav>
            <a href="index.html">home</a>
            <a href="shop.html">shop</a>
            <a href="profile.html" style="border-bottom: 1px solid #000;">profile</a>
        </nav>
    </header>

    <main>
        <h1>Profile.</h1>
        <div class="subtitle">— your kura identity —</div>
        <hr class="double">

        <div id="profile-content" class="loading">
            <p>Loading profile...</p>
        </div>
    </main>

    <footer>
        <p>© MMXXV Kura — enter at your own risk</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function () {
            'use strict';

            const contentDiv = document.getElementById('profile-content');

            // セッション確認
            const session = await checkSession();
            if (!session) {
                window.location.href = 'auth.html';
                return;
            }

            try {
                // プロフィール情報を取得
                const profileRes = await fetch(WORKER_URL + '/api/user/profile', {
                    credentials: 'include'
                });

                if (!profileRes.ok) throw new Error('Failed to fetch profile');
                const profile = await profileRes.json();

                // ロール情報を取得（ボット側が保存した情報）
                const roles = profile.roles || [];
                
                // プロフィール HTML を生成
                const rolesHtml = roles.length > 0
                    ? `<div class="roles-section">
                        <h3>Roles in Kura</h3>
                        <div class="roles-container">
                            ${roles.map((role, idx) => `
                                <div class="role-badge" style="border-color: ${role.color || '#000'}; color: ${role.color || '#000'}; animation-delay: ${idx * 0.1}s;">
                                    ${role.name || 'Unknown Role'}
                                </div>
                            `).join('')}
                        </div>
                    </div>`
                    : '<p style="color: #999; font-style: italic;">No roles yet</p>';

                contentDiv.innerHTML = `
                    <div class="profile-card">
                        <div class="profile-header">
                            <div class="profile-avatar">
                                ${profile.avatar ? `<img src="${profile.avatar}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">` : '👤'}
                            </div>
                            <div class="profile-info">
                                <h2>${profile.username}</h2>
                                <p><strong>ID:</strong> ${profile.userid}</p>
                            </div>
                        </div>

                        <div class="balance-box">
                            <div class="balance-label">Balance</div>
                            <div class="balance-value">💰 ${profile.balance || 0}</div>
                        </div>

                        ${rolesHtml}

                        <div class="action-buttons">
                            <a href="shop.html" class="btn btn-primary">→ Shop</a>
                            <button class="btn btn-secondary" onclick="logout()">Logout</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Profile load error:', err);
                contentDiv.innerHTML = `
                    <div class="error">
                        <p>Failed to load profile.</p>
                        <p style="font-size: 0.9rem; margin-top: 12px;">${err.message}</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
